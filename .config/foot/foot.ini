[main]  # 主配置段
term=xterm-256color
include=~/.config/foot/themes/noctalia
font=JetBrainsMono Nerd Font:size=10
dpi-aware=yes  # 跟随显示器DPI缩放，2.0 缩放下会自动放大到合适物理像素
pad=3x1 center  # 内边距
selection-target=clipboard  # 选中文本直接复制到剪贴板
resize-delay-ms=10  # 窗口缩放后的重排延迟（毫秒）
word-delimiters= ,│`|:"'()[]{}<>@%  # 双击选词时的分词符
bold-text-in-bright=yes  # 粗体文本使用亮色

[scrollback]  # 回滚缓冲配置
lines=1000  # 保留最近1000行历史输出

[csd]  # 客户端装饰（标题栏）配置
preferred=none  # 不用标题栏

[colors-dark]  # 深色配色方案
alpha=0.8  # 背景不透明度
foreground=f2edff  # 默认文字颜色：近白淡紫（配合浅紫背景）
cursor=000000 e0e0e0  # 光标：文字黑色、背景浅灰白（原版配色）
selection-background=9d8fd0  # 选中文本背景：浅紫
selection-foreground=1f1b33  # 选中文本前景：深紫
regular0=2e3436  # 常规色0：黑
regular1=cc0000  # 常规色1：红
regular2=4e9a06  # 常规色2：绿
regular3=c4a000  # 常规色3：黄
regular4=3465a4  # 常规色4：蓝
regular5=75507b  # 常规色5：紫
regular6=06989a  # 常规色6：青
regular7=d3d7cf  # 常规色7：浅灰
bright0=555753  # 亮色0：深灰
bright1=ef2929  # 亮色1：亮红
bright2=8ae234  # 亮色2：亮绿
bright3=fce94f  # 亮色3：亮黄
bright4=729fcf  # 亮色4：亮蓝
bright5=ad7fa8  # 亮色5：亮紫
bright6=34e2e2  # 亮色6：亮青
bright7=eeeeec  # 亮色7：白

[bell]  # 终端响铃配置
notify=no  # 响铃时不发桌面通知
visual=no  # 响铃时不用视觉闪烁

[cursor]  # 光标样式配置
style=beam  # 光标形状：beam为细竖线
blink=yes  # 光标闪烁，更容易定位

[mouse]  # 鼠标配置
hide-when-typing=no  # 打字时隐藏鼠标指针
