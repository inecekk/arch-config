# Kitty 终端配置
# 背景透明度：与 foot alpha=0.9 统一
background_opacity 0.9

# 动态背景透明度调整快捷键
map ctrl+shift+a> decrease_opacity
map ctrl+shift+s> increase_opacity
map ctrl+shift+r> set_opacity 1.0

# 字体（与 foot 统一：JetBrainsMono Nerd Font 10pt）
font_family      JetBrainsMono Nerd Font
font_size        10.0

# 光标样式
cursor_shape     block
cursor_blink_interval 0

# 颜色主题：浅紫背景 + 彩虹强调，与桌面统一
background       #7b6cae
foreground       #f2edff
selection_background #9d8fd0
color0           #5b4e85
color1           #ef4444
color2           #22c55e
color3           #f59e0b
color4           #3b82f6
color5           #a78bfa
color6           #22d3ee
color7           #e6def5
color8           #6f62a0
color9           #f87171
color10          #4ade80
color11          #fbbf24
color12          #60a5fa
color13          #c4b5fd
color14          #67e8f9
color15          #f5f0ff

# 隐藏窗口装饰（标题栏/边框）
hide_window_decorations yes

# 滚动
scrollback_lines 10000

# 鼠标
mouse_hide_wait  2.0

# 快捷键：退出
map ctrl+shift+q> quit
