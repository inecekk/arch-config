[location]
auto_locate = false                                         # 自动定位

[weather]
enabled = true                                              # 启用天气小组件
unit = "metric"                                             # 使用摄氏度
refresh_minutes = 30                                        # 每 30 分钟刷新一次天气数据
effects = true                                              # 显示天气动效

[bar]
position = "top"                                            # 状态栏位置：顶部
height = 32                                                 # 逻辑像素高度，niri scale 2.0 会自动渲染为物理 64px，无需再手动放大
background = "#e9d5ff"                                      # 状态栏背景色：浅紫，与 niri window-rule 的磨砂玻璃风格呼应
foreground = "#4b5563"                                      # 默认文字颜色：柔和中灰
color = "#e9d5ff"                                           # 补全：状态栏整体未设置颜色的默认浅紫基调

    [bar.default]
    border = "#a78bfa80"                                    # 边框颜色：中紫，透明度约 50%，呼应 niri focus-ring 的渐变红品配色思路
    border_width = 1.5                                      # 边框宽度（逻辑像素）
    color = "#d8b4fe"                                       # 补全：未单独指定颜色组件的默认浅紫色
    start = ["launcher", "workspaces", "active_window", "clock", "weather"]
    end = ["cpu", "gpu", "memory", "netspeed", "network", "media", "notifications", "wallpaper", "control-center", "bluetooth", "volume", "battery", "tray", "power_profile", "session"]

[widget.launcher]
color = "#c4a6a6"

[widget.workspaces]
color = "#c9b299"

[widget.active_window]
color = "#bfb89c"

[widget.clock]
format = "%H:%M:%S"
color = "#c9c199"

[widget.weather]
color = "#b3bf9e"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
color = "#a3c1a6"

[widget.gpu]
type = "sysmon"
stat = "gpu_usage"
color = "#9cc0b5"

[widget.memory]
type = "sysmon"
stat = "ram_usage"
color = "#96bcbf"

[widget.netspeed]
type = "sysmon"
stat = "net_rx"
color = "#93b0bf"

[widget.network]
show_label = false
color = "#9ba3c2"

[widget.media]
hide_when_no_media = true
title_scroll = "always"
color = "#a29cc2"

[widget.notifications]
color = "#af9cc2"

[widget.wallpaper]
color = "#bd9cc0"

[widget.control-center]
color = "#c29cb3"

[widget.bluetooth]
enabled = true
color = "#c29ca5"

[widget.volume]
color = "#c2a19c"

[widget.battery]
color = "#c2ac9c"

[widget.tray]
color = "#bfb89c"

[widget.power_profile]
color = "#9cb3bf"

[widget.brightness]
color = "#d8b4fe"                                           # 补全：原先漏掉的亮度组件，现已设为浅紫色

[widget.session]
color = "#b3bf9e"
