[General]
# 开启 iwd 的内置 IP 地址分配与网络配置功能（dhcp 等）
# 目的：让 iwd 直接处理网络连接，不再通过 NetworkManager 中转，提升底层稳定性
EnableNetworkConfiguration=true       

[Network]
# 指定域名解析服务交给 systemd-resolved 处理
NameResolvingService=systemd        

[Scan]
# 彻底禁用后台漫游扫描
# 目的：防止 Realtek 网卡频繁主动扫描周围热点，彻底根除因扫描导致的丢包和被路由器误判踢出
DisableRoamingScan=true             

[Roam]
# 将普通漫游触发阈值压到极低（-90 dBm）
# 目的：只要信号没差到快要断网的地步，绝对不主动触发漫游
RoamThreshold=-95
RoamThreshold5G=-95

# 将紧急漫游触发阈值压到极低（-95 dBm）
# 目的：保留极端情况下的极限漫游能力，避免彻底死板
CriticalRoamThreshold=-95
CriticalRoamThreshold5G=-95

