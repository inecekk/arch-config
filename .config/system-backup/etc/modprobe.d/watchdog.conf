# -----------------------------------------------------------------
# 硬件看门狗模块黑名单配置 (Watchdog Blacklist)
# 用途：屏蔽底层看门狗驱动，防止关机或重启时触发 watchdog did not stop! 报错
# -----------------------------------------------------------------

# AMD 芯片组（如 AMD Ryzen / FCH 南桥）内置的硬件看门狗驱动
blacklist sp5100_tco

# 英特尔平台的看门狗驱动（部分通用内核或模块链会尝试探测，顺手屏蔽）
blacklist iTCO_wdt

# 基于 ACPI 标准的通用硬件看门狗接口
blacklist wdat_wdt
