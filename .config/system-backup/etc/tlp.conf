# --- CPU 调速策略 ---
# 使用 amd-pstate-epp 驱动时，powersave 是最稳的，它配合 EPP 就能动态调频，不需要 performance
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# --- AMD 平台能耗偏好 (EPP) ---
# balance_power 在 AC 下足以兼顾流畅度和发热
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# --- USB 与 PCIe ---
USB_AUTOSUSPEND=1
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersupersave

# --- WiFi 省电 ---
WIFI_PWR_ON_AC=on
WIFI_PWR_ON_BAT=on

# --- 注意：PLATFORM_PROFILE 和 STOP_CHARGE_THRESH 在你的机型上无效，已移除 ---
