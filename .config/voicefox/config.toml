version = 9

[player]
engine = "mpv"
quality = "320k"
volume = 80
playback_speed = 1.0
audio_device = "auto"
replaygain_mode = "track"
replaygain_preamp = -6.0
channel_mode = "auto"
balance = 0.0
replaygain_clip = true
equalizer_bands = []
fade_in_ms = 500
fade_out_ms = 250
play_mode = "list-loop"
remember_playback_state = true
history_limit = 100

[source]
enabled = [
    "kg",
    "tx",
    "wy",
    "mg",
]
default = "wy"
auto_toggle = true
js_sources = []

[lyric]
show_translation = true
show_yrc = true
offset = 0

[network]
proxy_url = ""
timeout = 15

[theme]
use_dark = true
accent = "#cba6f7"
text = "#cdd6f4"
muted = "#a6adc8"
border = "#585b70"
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
subtext_1 = "#bac2de"
subtext_0 = "#a6adc8"
overlay_2 = "#9399b2"
overlay_1 = "#7f849c"
overlay_0 = "#6c7086"
surface_2 = "#585b70"
surface_1 = "#45475a"
surface_0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[ui]
enable_mouse = true
wrap_navigation = true
scroll_amount = 10
aggregate_search = true
show_cover = true
cover_protocol = "auto"
max_fps = 20
status_bar_items = [
    "state",
    "source",
    "sort",
    "song",
    "time",
    "volume",
    "play-mode",
    "quality",
    "queue",
]

[local_music]
enabled = true
paths = ["/home/lk/Music"]
max_depth = 5

[keybindings.global]
global_cycle_mode = "m"
global_volume_down = "b"
global_next_tab = "Tab"
global_play_pause = "Space"
global_seek_forward = "]"
global_redraw = "Ctrl+r"
global_toggle_favorite = "Ctrl+l"
global_prev_track = "Down"
global_volume_up = "n"
global_seek_backward = "["
global_next_track = "Up"
global_quit = "q"
global_prev_tab = "Shift+Tab"
global_go_to_main = "Esc"

